[Network]
topology = NVSwitch
num_gpus_per_server = 8
num_switches_per_server = 4
num_servers_per_super_node = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
num_spine_switches = 40
spine_leaf_links_per_pair = 32
routing_algorithm = min
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2
links_per_switch = 5,5,4,4

[Workload]
traffic = ring_all_reduce
packet_length = 1
traffic_scale = 1
injection_rate = 6.0
injection_increment = 3.0
max_injection = 18.0

[Simulation]
simulation_time = 30000
timeout_threshold = 500000
timeout_limit = 5000000
threads = 1
issue_width = 1000

[Files]
output_file = ../output/nvswitch_ring_ar_sweep.csv
log_file = ../output/nvswitch_ring_ar_sweep.log
