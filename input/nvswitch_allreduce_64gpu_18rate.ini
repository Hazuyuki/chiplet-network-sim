[Network]
topology = NVSwitch
num_gpus_per_server = 8
num_switches_per_server = 4
num_servers_per_super_node = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = ring_all_reduce
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 5000
start_injection = 0.5
injection_increment = 0.5
max_injection = 18
timeout_threshold = 50000
timeout_limit = 500000
threads = 16
issue_width = 32

[Files]
output_file = output/nvswitch_allreduce_64gpu_18rate.csv
log_file = output/nvswitch_allreduce_64gpu_18rate.log
