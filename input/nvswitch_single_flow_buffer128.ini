# 单流 buffer 对比：buffer_size=128
[Network]
topology = NVSwitch
num_gpus_per_group = 8
num_switches_per_group = 4
num_groups = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 128
vc_number = 2
flow_control = credit
credit_return_delay = 4

[Workload]
traffic = single_flow
packet_length = 1
traffic_scale = 1

[Simulation]
simulation_time = 2000
start_injection = 1
injection_increment = 1
max_injection = 20
timeout_threshold = 2000
timeout_limit = 200
threads = 8
issue_width = 32

[Files]
output_file = output/single_flow_buffer128.csv
log_file = output/single_flow_buffer128.log
