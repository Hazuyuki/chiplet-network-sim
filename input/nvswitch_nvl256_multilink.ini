# NVL256 式无阻塞 + 每对 (leaf,spine) 多链路
# 64 卡 8 机示例：spine_leaf_links_per_pair=4，spine-leaf 段带宽 x4，减轻拥塞
[Network]
topology = NVSwitch
num_gpus_per_group = 8
num_switches_per_group = 4
num_groups = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
spine_leaf_links_per_pair = 4
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 128
switch_buffer_size = 256
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = ring_all_reduce
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 2000
start_injection = 0.5
injection_increment = 0.5
max_injection = 18
timeout_threshold = 2000
timeout_limit = 200
threads = 8
issue_width = 32

[Files]
output_file = output/nvswitch_nvl256_multilink.csv
log_file = output/nvswitch_nvl256_multilink.log
