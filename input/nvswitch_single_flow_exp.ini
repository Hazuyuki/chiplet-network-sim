# 单发单收实验：node0 -> node1，用于验证单链路公式 min(B, C_eff/(T_other+R))
# PLACEHOLDER 在脚本中替换为 credit_return_delay 值
[Network]
topology = NVSwitch
num_gpus_per_group = 2
num_switches_per_group = 1
num_groups = 1
gpu_nvlink_ports = 18
switches_fully_connected = true
inter_group_sw_connect = false
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 8
vc_number = 2
router_stages = OneStage
flow_control = credit
credit_return_delay = PLACEHOLDER

[Workload]
traffic = single_flow
packet_length = 1
traffic_scale = 1

[Simulation]
simulation_time = 800
# 包泼洒理论饱和 18 flits/cycle；至少扫描到 max_injection 再判定饱和
start_injection = 0.5
injection_increment = 0.5
max_injection = 18
timeout_threshold = 1000
timeout_limit = 50
threads = 1
issue_width = 32

[Files]
output_file = output/single_flow_delay_PLACEHOLDER.csv
log_file = output/single_flow_delay_PLACEHOLDER.log
