[Network]
topology = NVSwitch
num_gpus_per_group = 4
num_switches_per_group = 2
num_groups = 4
num_spine_switches = 2
gpu_nvlink_ports = 8
switches_fully_connected = true
inter_group_sw_connect = false
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 8
vc_number = 2
flow_control = credit

[Workload]
traffic = uniform
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 500
start_injection = 0.1
injection_increment = 0.1
timeout_threshold = 1000
timeout_limit = 100
threads = 4
issue_width = 32

[Files]
output_file = ../../output/nvswitch_spine.csv
