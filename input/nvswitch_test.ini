[Network]
topology = NVSwitch
num_gpus_per_group = 4
num_switches_per_group = 3
num_groups = 1
switch_radix = 10
switches_fully_connected = true
inter_group_sw_connect = false
routing_algorithm = direct
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 8
vc_number = 2
router_stages = OneStage

[Workload]
traffic = uniform
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 100
start_injection = 0.1
injection_increment = 0.05
timeout_threshold = 1000
timeout_limit = 100
threads = 1
issue_width = 32

[Files]
output_file = ../../output/nvswitch_test.csv
