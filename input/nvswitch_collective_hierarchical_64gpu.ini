[Network]
topology = NVSwitch
num_gpus_per_server = 8
num_switches_per_server = 4
num_servers_per_super_node = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = collective_hierarchical_all_reduce
packet_length = 1
traffic_scale = 64

[Simulation]
simulation_time = 2000
start_injection = 1.0
injection_increment = 1.0
max_injection = 20
timeout_threshold = 10000
timeout_limit = 100000
threads = 8
issue_width = 32

[Files]
output_file = output/nvswitch_collective_hierarchical_64gpu.csv
log_file = output/nvswitch_collective_hierarchical_64gpu.log
