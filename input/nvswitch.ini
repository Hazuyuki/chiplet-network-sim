[Network]
topology = NVSwitch
num_gpus_per_group = 8
num_switches_per_group = 4
num_groups = 1
gpu_nvlink_ports = 18
switches_fully_connected = true
inter_group_sw_connect = false
routing_algorithm = direct
gpu_switch_latency = 1
switch_switch_latency = 1

[Router]
router_stages = OneStage
buffer_size = 8
vc_number = 2

[Workload]
traffic = uniform
packet_length = 1
traffic_scale = 1

[Simulation]
simulation_time = 10000
start_injection = 0.1
injection_increment = 0.05
timeout_threshold = 1000
timeout_limit = 100
threads = 8
issue_width = 32

[Files]
output_file = ../../output/nvswitch.csv
