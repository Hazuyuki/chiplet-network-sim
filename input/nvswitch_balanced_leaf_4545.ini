[Network]
topology = NVSwitch
num_gpus_per_server = 8
num_switches_per_server = 4
num_servers_per_super_node = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
num_spine_switches = 40
spine_leaf_links_per_pair = 1
routing_algorithm = min
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2
links_per_switch = 4,5,4,5

[Workload]
traffic = collective_ring_all_reduce
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 2000
threads = 1
issue_width = 1000
timeout_threshold = 50000
timeout_limit = 500000

[Files]
output_file = output/nvswitch_balanced_4545.csv
log_file = output/nvswitch_balanced_4545.log