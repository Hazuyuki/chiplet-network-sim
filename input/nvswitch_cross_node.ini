# 多流跨 node 实验：验证 spine 无阻塞
# 所有流量的 src/dest 在不同 group，全部经 spine。若无阻塞，高注入率下不应提前饱和/大量 timeout。
[Network]
topology = NVSwitch
num_gpus_per_group = 8
num_switches_per_group = 4
num_groups = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 8
vc_number = 2
flow_control = credit
credit_return_delay = 4

[Workload]
traffic = inter_group_uniform
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 2000
start_injection = 0.1
injection_increment = 0.2
max_injection = 8
timeout_threshold = 2000
timeout_limit = 200
threads = 8
issue_width = 32

[Files]
output_file = output/nvswitch_cross_node.csv
log_file = output/nvswitch_cross_node.log
