# E1 分段隔离：单机 8 GPU，无 spine，ring all-reduce
# 用于对比 8 组 64 GPU：若 64 GPU 饱和远低于此，则跨组(spine)段是瓶颈
[Network]
topology = NVSwitch
num_gpus_per_group = 8
num_switches_per_group = 4
num_groups = 1
gpu_nvlink_ports = 18
switches_fully_connected = true
routing_algorithm = min
buffer_size = 128
switch_buffer_size = 256
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = ring_all_reduce
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 2000
start_injection = 0.1
injection_increment = 0.5
max_injection = 18
timeout_threshold = 2000
timeout_limit = 200
threads = 8
issue_width = 32

[Files]
output_file = output/nvswitch_8gpu_single_group.csv
log_file = output/nvswitch_8gpu_single_group.log
