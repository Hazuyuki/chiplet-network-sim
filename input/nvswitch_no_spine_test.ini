[Network]
topology = NVSwitch
num_gpus_per_server = 8
num_switches_per_server = 4
num_servers_per_super_node = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = false
num_spine_switches = 0
inter_group_sw_connect = true
routing_algorithm = min
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = single_flow
packet_length = 1
traffic_scale = 1
single_flow_dest = 1

[Simulation]
simulation_time = 1000
threads = 1
issue_width = 1000

[Files]
output_file = output/nvswitch_no_spine.csv
log_file = output/nvswitch_no_spine.log