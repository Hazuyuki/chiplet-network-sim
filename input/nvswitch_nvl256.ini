# NVL256 无阻塞拓扑：256 GPU，32 group × 8 GPU，4 leaf/group
# 参考 docs/NVL256无阻塞网络结构.md
# spine_non_blocking 确保 leaf-spine 无 oversubscription
# 可选：spine_leaf_links_per_pair = 2 或 4 启用每对 (leaf,spine) 多链路
[Network]
topology = NVSwitch
num_gpus_per_group = 8
num_switches_per_group = 4
num_groups = 32
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 64
vc_number = 2
flow_control = credit
credit_return_delay = 4

[Workload]
traffic = ring_all_reduce
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 2000
start_injection = 0.5
injection_increment = 0.5
max_injection = 18
timeout_threshold = 2000
timeout_limit = 200
threads = 8
issue_width = 32

[Files]
output_file = output/nvswitch_nvl256.csv
log_file = output/nvswitch_nvl256.log
