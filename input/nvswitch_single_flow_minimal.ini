# 单流最小拓扑：2 GPU, 1 switch，对比 64-GPU 拓扑
[Network]
topology = NVSwitch
num_gpus_per_group = 2
num_switches_per_group = 1
num_groups = 1
gpu_nvlink_ports = 18
switches_fully_connected = true
inter_group_sw_connect = false
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 64
vc_number = 2
flow_control = credit
credit_return_delay = 0

[Workload]
traffic = single_flow
packet_length = 1
traffic_scale = 1

[Simulation]
simulation_time = 2000
start_injection = 1
injection_increment = 1
max_injection = 20
timeout_threshold = 2000
timeout_limit = 200
threads = 8
issue_width = 32

[Files]
output_file = output/single_flow_minimal.csv
log_file = output/single_flow_minimal.log
