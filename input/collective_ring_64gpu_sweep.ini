[Network]
topology = NVSwitch
num_gpus_per_server = 8
num_switches_per_server = 4
num_servers_per_super_node = 8
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = collective_ring_all_reduce
packet_length = 1
traffic_scale = 64
data_size = 262144

[Simulation]
simulation_time = 5000
threads = 16
issue_width = 1000

[Files]
output_file = output/collective_ring_64gpu_sweep.csv
log_file = output/collective_ring_64gpu_sweep.log
