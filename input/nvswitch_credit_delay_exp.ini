# 实验：不同 credit_return_delay，用 PLACEHOLDER 在脚本里替换为 0,2,4,...,24
[Network]
topology = NVSwitch
num_gpus_per_group = 4
num_switches_per_group = 3
num_groups = 1
gpu_nvlink_ports = 18
switches_fully_connected = true
inter_group_sw_connect = false
routing_algorithm = direct
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 8
vc_number = 2
router_stages = OneStage
flow_control = credit
credit_return_delay = PLACEHOLDER

[Workload]
traffic = uniform
packet_length = 1
traffic_scale = 0

[Simulation]
simulation_time = 800
start_injection = 0.05
injection_increment = 0.008
timeout_threshold = 1000
timeout_limit = 50
threads = 1
issue_width = 32

[Files]
output_file = output/credit_delay_PLACEHOLDER.csv
log_file = output/credit_delay_PLACEHOLDER.log
