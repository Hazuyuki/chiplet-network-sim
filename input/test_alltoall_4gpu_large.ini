[Network]
topology = NVSwitch
num_gpus_per_server = 4
num_switches_per_server = 2
num_servers_per_super_node = 1
gpu_nvlink_ports = 18
switches_fully_connected = true
spine_non_blocking = true
routing_algorithm = min
gpu_switch_latency = 1
switch_switch_latency = 1
buffer_size = 64
switch_buffer_size = 2048
vc_number = 2
flow_control = credit
credit_return_delay = 2

[Workload]
traffic = collective_alltoall
packet_length = 32
traffic_scale = 4

[Simulation]
simulation_time = 5000
threads = 1
issue_width = 1000

[Files]
traffic_matrix_file = input/traffic_matrix/alltoall_4gpu.csv
output_file = output/alltoall_4gpu_large.csv
log_file = output/alltoall_4gpu_large.log
